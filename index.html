<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title> 
    
    <style> 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
        } 

        body { 
            /* خلفية داكنة عميقة تميل لأسود الكربون الفخم */
            background: radial-gradient(circle at center, #1a1510 0%, #0a0806 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #f8fafc; 
            overflow: hidden;
            position: relative;
        } 

        /* توهج خلفي ناعم باللون الذهبي الدافئ */
        body::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: #d4af37;
            filter: blur(160px);
            opacity: 0.12;
            top: 20%;
            left: 20%;
            z-index: 0;
        }

        .container { 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            position: relative;
            z-index: 1;
        } 

        .status-card { 
            /* تصميم زجاجي داكن بلمسة ذهبية */
            background: rgba(22, 19, 16, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 
                        0 0 40px rgba(212, 175, 55, 0.08); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            gap: 30px; 
            border: 1px solid rgba(212, 175, 55, 0.15); 
        } 

        .status-message { 
            font-size: 1.35rem; 
            font-weight: 500; 
            line-height: 1.7; 
            color: #f3f4f6; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        } 

        /* الدائرة الدوّارة النيونية باللون الذهبي والأحمر المتوهج */
        .loader { 
            width: 56px; 
            height: 56px; 
            border: 4px solid rgba(212, 175, 55, 0.1); 
            border-top-color: #ffd700; /* ذهبي مضيء */
            border-right-color: #ef4444; /* أحمر نيوني */
            border-radius: 50%; 
            animation: spin 1s infinite cubic-bezier(0.4, 0, 0.2, 1); 
            display: inline-block;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25),
                        0 0 10px rgba(239, 68, 68, 0.15);
        } 

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        } 

        /* إخفاء أي أشرطة تقدم أو خطوط تعبئة قد تُحضرها السكريبتات المحمّلة */
        progress, 
        .progress-bar, 
        .bar, 
        #bar, 
        #progress { 
            display: none !important; 
        } 
    </style> 
</head> 
<body> 

<script> 
var uaFull = navigator.userAgent; 
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i); 
var isPS4 = match !== null; 
var fwVersion = isPS4 ? match[1] : "Unknown"; 
var fwNum = parseFloat(fwVersion); 

function hideLoader() {
    var loader = document.getElementById("loader");
    if (loader) {
        loader.style.display = "none";
    }
}

function onScriptError() { 
    hideLoader();
    msgs.innerHTML = "عذراً، امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت ..."; 
} 

if (!isPS4) { 
    document.addEventListener("DOMContentLoaded", () => { 
        hideLoader();
        msgs.innerHTML = "مخصص فقط لأجهزة PS4 بإصدارات البرامج الثابتة من 9.00 إلى 13.00"; 
    }); 
} else { 
    if (window.applicationCache.status == '0') { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { 
            window.location.replace("cache900.html"); 
        } else if (fwNum >= 10.00 && fwNum <= 11.02) { 
            window.location.replace("cachecss.html"); 
        } else if (fwNum >= 11.50 && fwNum <= 13.00) { 
            window.location.replace("cacheslopkit.html"); 
        } else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } else { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "900/alert.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 10.00 && fwNum <= 11.02) { 
            var script = document.createElement('script'); 
            script.src = "css/main.js"; 
            script.onerror = onScriptError; 
            script.onload = function () { 
                setTimeout(function () { 
                    doJb(); 
                }, 500); 
            }; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 11.50 && fwNum <= 12.02) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "slopkit/chain_lapse.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 12.50 && fwNum <= 13.00) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "slopkit/chain_poops.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } 
} 
</script> 

<div class="container"> 
    <div class="status-card"> 
        <span id="loader" class="loader"></span> 
        <h2 id="msgs" class="status-message">جارٍ تحميل GoldHEN... يُرجى الانتظار</h2> 
    </div> 
</div> 

</body> 
</html>
