<!DOCTYPE html>
<html>
<head>
<title>Bashir-ps4-ps5</title>
<link rel="stylesheet" href="../style.css">

<style id="fixed-img-background">

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html {
    background: #000 url("img.jpg") center center / cover no-repeat fixed;
    scrollbar-width: none;
}

html::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

body {
    min-height: 100vh;
    position: relative;

    /* الخلفية */
    background: transparent !important;

    /* النص في المنتصف */
    color: #fff;
    text-align: center;

    overflow: hidden;

    /* ترتيب المحتوى في المنتصف */
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* طبقة شفافة فوق الخلفية */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.32);
}

/* كل محتوى الصفحة فوق الخلفية */
body > * {
    position: relative;
    z-index: 1;
}

/* العنوان */
body h1 {
    width: 100%;
    margin: 30px 0 20px 0;
    padding: 0;

    text-align: center;

    color: #fff;
    font-size: 36px;

    text-shadow:
        2px 2px 5px #000,
        -1px -1px 2px #000;
}

/* الخط */
body hr {
    width: 95%;
    margin: 0 auto;

    border: 0;
    border-top: 1px solid rgba(255,255,255,0.65);
}

/* رسالة GoldHEN */
#msgs {
    width: 100%;

    margin: 0;
    padding: 0 20px;

    /* وضع الرسالة في منتصف الشاشة */
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    font-size: 30px;

    color: #fff;

    text-shadow:
        2px 2px 5px #000,
        -1px -1px 2px #000;
}

</style>

</head>

<body>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    document.getElementById("msgs").innerHTML =
        "المحتوى غير موجود! - امسح بيانات المتصفح وأعد تثبيت التخزين المؤقت...";
}

if (!isPS4) {

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msgs").innerHTML =
            "مخصص فقط لأجهزة PS4";
    });

} else {

    if (window.applicationCache.status == '0') {

        if (fwNum >= 9.00 && fwNum <= 9.60) {

            window.location.replace("cache900.html");

        } else if (fwNum >= 10.00 && fwNum <= 11.02) {

            window.location.replace("cachecss.html");

        } else if (fwNum >= 11.50 && fwNum <= 13.00) {

            window.location.replace("cacheslopkit.html");

        } else {

            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("msgs").innerHTML =
                    'نظام غير مدعوم: <span style="color: red;">'
                    + fwVersion +
                    '</span>';
            });

        }

    } else {

        document.addEventListener("DOMContentLoaded", () => {

            if (fwNum >= 9.00 && fwNum <= 9.60) {

                var script = document.createElement('script');
                script.type = 'module';
                script.src = "900/alert.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);

            }

            else if (fwNum >= 10.00 && fwNum <= 11.02) {

                var script = document.createElement('script');
                script.src = "css/main.js";
                script.onerror = onScriptError;

                script.onload = function () {
                    setTimeout(function () {
                        doJb();
                    }, 500);
                };

                document.head.appendChild(script);

            }

            else if (fwNum >= 11.50 && fwNum <= 12.02) {

                var script = document.createElement('script');
                script.type = 'module';
                script.src = "slopkit/chain_lapse.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);

            }

            else if (fwNum >= 12.50 && fwNum <= 13.00) {

                var script = document.createElement('script');
                script.type = 'module';
                script.src = "slopkit/chain_poops.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);

            }

        });
    }
}

</script>

<h1 dir="rtl">Bashir-ps4-ps5</h1>

<hr>

<h1 id="msgs" dir="rtl">
    جارٍ تحميل GoldHEN... يُرجى الانتظار
</h1>

</body>
</html>
