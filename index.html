<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title> 
    
    <style> 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
        } 

        body { 
            background: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0a0b10 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #ffffff; 
            overflow: hidden;
            position: relative;
        } 

        /* خلفية جمالية متوهجة سينمائية */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            filter: blur(150px);
            opacity: 0.2;
            top: 20%;
            right: 20%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            filter: blur(150px);
            opacity: 0.15;
            bottom: 20%;
            left: 20%;
            z-index: 0;
        }

        .container { 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            z-index: 1;
        } 

        /* بطاقة زجاجية مودرن Glassmorphism */
        .status-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            gap: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            position: relative;
        } 

        /* تأثير التوهج العلوي للبطاقة */
        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00f2fe, #ff007f, transparent);
            border-radius: 0 0 4px 4px;
        }

        /* نصوص احترافية متوهجة مدمجة بالخط */
        .status-message { 
            font-size: 1.4rem; 
            font-weight: 700; 
            line-height: 1.6; 
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
        } 

        /* لودر ثلاثي العناصر مع الحفاظ على المعرف ليعمل مع الاسكريبت */
        .loader { 
            width: 80px; 
            height: 80px; 
            border: 3px solid transparent; 
            border-top-color: #00f2fe; 
            border-bottom-color: #00f2fe;
            border-radius: 50%; 
            animation: spin 1.5s infinite linear; 
            display: inline-block;
            position: relative;
        } 

        .loader::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 3px solid transparent;
            border-left-color: #ff007f;
            border-right-color: #ff007f;
            border-radius: 50%;
            animation: spin-reverse 1s infinite linear;
        }

        .loader::after {
            content: '';
            position: absolute;
            top: 22px;
            left: 22px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f2fe, 0 0 30px #00f2fe;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        } 

        @keyframes spin-reverse { 
            0% { transform: rotate(360deg); } 
            100% { transform: rotate(0deg); } 
        } 

        /* إخفاء أي أشرطة تقدم أو خطوط تعبئة قد تُحضرها السكريبتات المحمّلة */
        progress, 
        .progress-bar, 
        .bar, 
        #bar, 
        #progress { 
            display: none !important; 
        } 
    </style> 
</head> 
<body> 

<script> 
var uaFull = navigator.userAgent; 
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i); 
var isPS4 = match !== null; 
var fwVersion = isPS4 ? match[1] : "Unknown"; 
var fwNum = parseFloat(fwVersion); 

function hideLoader() {
    var loader = document.getElementById("loader");
    if (loader) {
        loader.style.display = "none";
    }
}

function onScriptError() { 
    hideLoader();
    msgs.innerHTML = "عذراً، امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت ..."; 
} 

if (!isPS4) { 
    document.addEventListener("DOMContentLoaded", () => { 
        hideLoader();
        msgs.innerHTML = "مخصص فقط لأجهزة PS4 بإصدارات البرامج الثابتة من 9.00 إلى 13.00"; 
    }); 
} else { 
    if (window.applicationCache.status == '0') { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { 
            window.location.replace("cache900.html"); 
        } else if (fwNum >= 10.00 && fwNum <= 11.02) { 
            window.location.replace("cachecss.html"); 
        } else if (fwNum >= 11.50 && fwNum <= 13.00) { 
            window.location.replace("cacheslopkit.html"); 
        } else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } else { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "900/alert.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 10.00 && fwNum <= 11.02) { 
            var script = document.createElement('script'); 
            script.src = "css/main.js"; 
            script.onerror = onScriptError; 
            script.onload = function () { 
                setTimeout(function () { 
                    doJb(); 
                }, 500); 
            }; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 11.50 && fwNum <= 12.02) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "slopkit/chain_lapse.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else if (fwNum >= 12.50 && fwNum <= 13.00) { 
            var script = document.createElement('script'); 
            script.type = 'module'; 
            script.src = "slopkit/chain_poops.js"; 
            script.onerror = onScriptError; 
            document.head.appendChild(script); 
        } 
        else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } 
} 
</script> 

<div class="container"> 
    <div class="status-card"> 
        <span id="loader" class="loader"></span> 
        <h2 id="msgs" class="status-message">جارٍ تحميل GoldHEN... يُرجى الانتظار</h2> 
    </div> 
</div> 

</body> 
</html>
