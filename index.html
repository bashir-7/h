<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Bashir PS4/PS5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bashir / PS4 / 9.00 / 13.52</h1>
    <hr>
    <br>
    
    <!-- تم وضع العنصر قبل السكريبت ليكون متاحاً فوراً بدون انتظار -->
    <h1 id="msgs" style="font-size: 34px; margin-top: 77px; margin-bottom: 455px;">
        جارٍ تحميل GoldHEN... يُرجى الانتظار
    </h1>

    <script>
        // دالة آمنة وسريعة لتحديث الرسائل
        function showMsg(msg, isError) {
            var el = document.getElementById("msgs");
            if (el) el.innerHTML = isError ? '<span style="color: red;">' + msg + '</span>' : msg;
        }

        function onScriptError() {
            showMsg("امسح بيانات المتصفح وأعد تثبيت التخزين المؤقت ...", true);
        }

        // الفحص والتنفيذ المباشر لتوفير أقصى سرعة لثغرة 9.00 وباقي الإصدارات
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);

        if (!match) {
            showMsg("مخصص فقط لأجهزة PS4", true);
        } else {
            var fwVersion = match[1];
            var fwNum = parseFloat(fwVersion);
            var isUncached = (window.applicationCache && window.applicationCache.status === 0);

            if (isUncached) {
                // حالة عدم وجود التخزين المؤقت (توجيه فوري)
                if (fwNum >= 9.00 && fwNum <= 9.60) window.location.replace("cache900.html");
                else if (fwNum >= 10.00 && fwNum <= 11.02) window.location.replace("cachecss.html");
                else if (fwNum >= 11.50 && fwNum <= 13.00) window.location.replace("cacheslopkit.html");
                else if (fwNum >= 13.02 && fwNum <= 13.52) window.location.replace("13xx/index.html");
                else showMsg("نظام غير مدعوم: " + fwVersion, true);
            } else {
                // حالة تشغيل الكاش والجيلبريك
                if (fwNum >= 13.02 && fwNum <= 13.52) {
                    window.location.replace("13xx/index.html");
                } 
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "900/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                } 
                else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    var script = document.createElement('script');
                    script.src = "css/main.js";
                    script.onerror = onScriptError;
                    script.onload = function () {
                        setTimeout(function () {
                            if (typeof doJb === "function") doJb();
                        }, 500);
                    };
                    document.head.appendChild(script);
                } 
                else if (fwNum >= 11.50 && fwNum <= 12.02) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_lapse.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                } 
                else if (fwNum >= 12.03 && fwNum <= 13.00) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_poops.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                } 
                else {
                    showMsg("نظام غير مدعوم: " + fwVersion, true);
                }
            }
        }
    </script>
</body>
</html>
