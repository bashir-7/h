<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title> 
    
    <style> 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; } 
        body { background: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0a0b10 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; direction: rtl; padding: 20px; overflow: hidden; position: relative; } 
        body::before { content: ''; position: absolute; width: 300px; height: 300px; background: linear-gradient(45deg, #00f2fe, #4facfe); filter: blur(150px); opacity: 0.2; top: 20%; right: 20%; z-index: 0; } 
        body::after { content: ''; position: absolute; width: 300px; height: 300px; background: linear-gradient(45deg, #ff007f, #7928ca); filter: blur(150px); opacity: 0.15; bottom: 20%; left: 20%; z-index: 0; } 
        .container { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 750px; text-align: center; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1); z-index: 1; position: relative; } 
        .container::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 40%; height: 4px; background: linear-gradient(90deg, transparent, #00f2fe, #ff007f, transparent); border-radius: 0 0 4px 4px; } 
        .header-title { font-size: 2.2rem; font-weight: 800; background: linear-gradient(120deg, #ffffff, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; text-shadow: 0 0 20px rgba(0, 242, 254, 0.3); } 
        .divider { height: 2px; background: linear-gradient(90deg, transparent, #ff007f, #00f2fe, transparent); border: none; margin-bottom: 35px; } 
        .status-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 40px 25px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; } 
        .status-message { font-size: 1.4rem; font-weight: 700; line-height: 1.6; background: linear-gradient(120deg, #ffffff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #ffffff; } 
        
        /* إخفاء الـ 0% بصرياً تماماً وحظر ظهورها */
        .percentage-loader { display: none !important; } 
        
        progress, .progress-bar, .bar, #bar, #progress, .progress-box { display: none !important; } 
    </style> 
</head> 
<body> 

<script> 
var uaFull = navigator.userAgent; 
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i); 
var isPS4 = match !== null; 

// إصلاح آمن ومضمون لاستخراج رقم إصدار النظام لمنع إطلاق دالة الخطأ التلقائية
var fwVersion = (isPS4 && match && match[1]) ? match[1] : "0.00"; 
var fwNum = parseFloat(fwVersion); 

// إذا فشل الفحص التلقائي لـ UA، نتحقق يدوياً من السلسلة النصية كخط دفاع ثانٍ لمنع رسالة الخطأ
if (isPS4 && fwNum === 0) {
    if (uaFull.indexOf("4/11.50") !== -1) fwNum = 11.50;
    else if (uaFull.indexOf("4/11.00") !== -1) fwNum = 11.00;
    else if (uaFull.indexOf("4/9.00") !== -1) fwNum = 9.00;
    else if (uaFull.indexOf("4/10.00") !== -1) fwNum = 10.00;
    else fwNum = 11.50; // تعيين افتراضي آمن للإصدارات الحديثة لمنع انهيار الصفحة
}

function hideLoader() {
    var loader = document.getElementById("loader");
    if (loader) { loader.style.display = "none"; }
}

function onScriptError() { 
    hideLoader();
    msgs.innerHTML = "عذراً، امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت"; 
} 

if (!isPS4) { 
    document.addEventListener("DOMContentLoaded", () => { 
        hideLoader();
        msgs.innerHTML = "مخصص فقط لأجهزة PS4 بإصدارات البرامج الثابتة من 9.00 إلى 13.00"; 
    }); 
} else { 
    if (window.applicationCache.status == '0') { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { window.location.replace("cache900.html"); } 
        else if (fwNum >= 10.00 && fwNum <= 11.02) { window.location.replace("cachecss.html"); } 
        else if (fwNum >= 11.50 && fwNum <= 13.00) { window.location.replace("cacheslopkit.html"); } 
        else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } else { 
        if (fwNum >= 9.00 && fwNum <= 9.60) { 
            var script = document.createElement('script'); script.type = 'module'; script.src = "900/alert.js"; script.onerror = onScriptError; document.head.appendChild(script); 
        } 
        else if (fwNum >= 10.00 && fwNum <= 11.02) { 
            var script = document.createElement('script'); script.src = "css/main.js"; script.onerror = onScriptError; 
            script.onload = function () { setTimeout(function () { doJb(); }, 500); }; document.head.appendChild(script); 
        } 
        else if (fwNum >= 11.50 && fwNum <= 12.02) { 
            var script = document.createElement('script'); script.type = 'module'; script.src = "slopkit/chain_lapse.js"; script.onerror = onScriptError; document.head.appendChild(script); 
        } 
        else if (fwNum >= 12.50 && fwNum <= 13.00) { 
            var script = document.createElement('script'); script.type = 'module'; script.src = "slopkit/chain_poops.js"; script.onerror = onScriptError; document.head.appendChild(script); 
        } 
        else { 
            document.addEventListener("DOMContentLoaded", () => { 
                hideLoader();
                msgs.innerHTML = 'البرامج الثابتة غير المدعومة: <span style="color: #ef4444;">' + fwVersion + '</span>'; 
            }); 
        } 
    } 
} 
</script> 

<div class="container"> 
    <div class="status-card"> 
        <span id="loader" class="percentage-loader">0%</span> 
        <h2 id="msgs" class="status-message">جارٍ تحميل GoldHEN يُرجى الانتظار</h2> 
    </div> 
</div> 

</body> 
</html>
