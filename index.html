<!DOCTYPE html>
<html>
<head>
<title>Bashir electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.className = "msg-error"; msgs.innerHTML = "تعذر تحميل الملفات المطلوبة. امسح بيانات المتصفح وأعد تثبيت التخزين المؤقت.";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", function () {
        msgs.className = "msg-error"; msgs.innerHTML = "مخصص فقط لأجهزة PS4 التي تعمل بإصدارات من 9.00 إلى 13.52.";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", function () {
                msgs.className = "msg-error"; msgs.innerHTML = 'إصدار النظام غير مدعوم: <span class="msg-error-text" dir="ltr">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<div class="header"><span class="dot"></span><span class="brand">BASHIR SYSTEM</span><span class="dot"></span><span class="sub">EXPLOIT HOST • 9.00 — 13.52</span></div><h1>Bashir-9xx-13xx</h1>
<hr>
<br>
<h1 id=msgs>جارٍ تحميل... GoldHEN ...يُرجى الانتظار</h1>

</body>
</html>
