<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="utf-8">
<title>Bashir-ps4-ps5</title>
<link rel="stylesheet" href="../style.css">
<script>
// مسح السجل بأمان دون إحداث تشنج للمتصفح
if (window.history && window.history.replaceState) {
    window.history.replaceState(null, null, 'index.html');
}

function DLProgress(e) {
    if (e.lengthComputable) {
        var percent = Math.round((e.loaded / e.total) * 100);
        var msgs = document.getElementById("msgs");
        if (msgs) {
            msgs.innerHTML = "تثبيت ذاكرة التخزين المؤقت دون اتصال: " + percent + "%";
        }
    }
}

function DisplayCacheProgress() {
    var msgs = document.getElementById("msgs");
    if (msgs) {
        msgs.innerHTML = "تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";
        setTimeout(function() {
            msgs.innerHTML = "يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله";
        }, 2000);
    }
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    
    window.applicationCache.oncached = function(e) { 
        DisplayCacheProgress(); 
    };
    
    window.applicationCache.onupdateready = function(e) { 
        try {
            window.applicationCache.swapCache();
        } catch(err) {}
        DisplayCacheProgress(); 
    };
    
    window.applicationCache.onerror = function(e) { 
        var msgs = document.getElementById("msgs");
        if (msgs) {
            msgs.innerHTML = "خطأ في تثبيت ذاكرة التخزين المؤقت! - امسح بيانات المتصفح وحاول مجدداً.";
        }
    };
}
</script>
</head>
<body>

<h1>تحياتى مركز بشير</h1>
<hr>
<br>
<h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">بدء تثبيت ذاكرة التخزين المؤقت...</h1>

</body>
</html>
