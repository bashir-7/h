<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bashir-ps4-ps5</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<h1>Bashir-ps4-ps5</h1>
<hr>
<br>
<h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">يُرجى الانتظار جارٍ التحميل...</h1>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var msgs = document.getElementById("msgs");
    var uaFull = navigator.userAgent;
    var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Unknown";
    var fwNum = parseFloat(fwVersion);

    function onScriptError() {
        if (msgs) msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
    }

    if (!isPS4) {
        msgs.innerHTML = "مخصص فقط لأجهزة PS4";
        return;
    }

    // التحقق من التخزين المؤقت
    if (window.applicationCache && window.applicationCache.status === 0) {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
        }
    } else {
        // تنظيف ذاكرة المتصفح تلقائياً قبل تشغيل الثغرة
        if (window.gc) window.gc();

        if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                // إعطاء المتصفح مهلة 1000ms لاستقرار الذاكرة وتخفيف التشنج
                setTimeout(function () {
                    if (typeof doJb === 'function') {
                        doJb();
                    }
                }, 1000);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
});
</script>

</body>
</html>
