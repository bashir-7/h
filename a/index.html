<!DOCTYPE html>
<html>
<head>
<title>Bashir-ps4-ps5</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    document.getElementById("msgs").innerHTML = "المحتوى غير موجود! - امسح بيانات المتصفح وأعد تثبيت التخزين المؤقت...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msgs").innerHTML = "مخصص فقط لأجهزة PS4";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("msgs").innerHTML = 'نظام غير مدعوم: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        // انتظام تحميل السكريبتات بعد تجهيز واجهة المستخدم لتفادي أخطاء الـ ID
        document.addEventListener("DOMContentLoaded", () => {
            if (fwNum >= 9.00 && fwNum <= 9.60) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "900/alert.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
            }
            else if (fwNum >= 10.00 && fwNum <= 11.02) {
                var script = document.createElement('script');
                script.src = "css/main.js";
                script.onerror = onScriptError;
                script.onload = function () {
                    setTimeout(function () {
                        doJb();
                    }, 500);
                };
                document.head.appendChild(script);
            }
            else if (fwNum >= 11.50 && fwNum <= 12.02) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "slopkit/chain_lapse.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
            }
            else if (fwNum >= 12.50 && fwNum <= 13.00) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "slopkit/chain_poops.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
            }
        });
    }
}
</script>
<h1>Bashir-ps4-ps5</h1>
<hr>
<br>
<h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جارٍ تحميل GoldHEN... يُرجى الانتظار</h1>

</body>
</html>
