<!DOCTYPE html>
<html manifest="css.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title>
    
    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        /* --- خلفية متحركة خفيفة تناسب PS4 --- */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: moveBlob 12s infinite alternate ease-in-out;
            will-change: transform;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: #0088b6;
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #4facfe;
            bottom: -15%;
            right: -10%;
            animation-delay: -6s;
        }

        .blob-3 {
            width: 280px;
            height: 280px;
            background: #3b82f6;
            top: 40%;
            left: 50%;
            animation-duration: 16s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        /* --- Container والبطاقة --- */
        .container {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 1;
        }

        .status-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 242, 254, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 22px;
            border: 1px solid var(--card-border);
            position: relative;
        }

        /* الشعار العلوي */
        .brand-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--secondary-color);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .status-message {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* مؤشر التحميل الدائري */
        .loader-container {
            position: relative;
            width: 54px;
            height: 54px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--primary-color);
            border-right-color: var(--secondary-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- شريط التقدم العصري --- */
        .progress-box {
            width: 100%;
            max-width: 460px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 20px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

<!-- عناصر الخلفية المتحركة -->
<div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="container">
    <div class="status-card">
        <div class="brand-badge">مركز بشير لصيانة والتعديل</div>
        
        <div id="loader-wrapper" class="loader-container">
            <span id="loader" class="loader"></span>
        </div>

        <h2 id="msgs" class="status-message">بدء تثبيت ذاكرة التخزين المؤقت...</h2>
        
        <div class="progress-box">
            <div id="bar" class="progress-bar"></div>
        </div>
    </div>
</div>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function hideLoader() {
    var loaderWrapper = document.getElementById("loader-wrapper");
    if (loaderWrapper) {
        loaderWrapper.style.display = "none";
    }
}

function DLProgress(e) {
    if (e.lengthComputable) {
        var percent = Math.round((e.loaded / e.total) * 100);
        var msgs = document.getElementById("msgs");
        var bar = document.getElementById("bar");
        
        if (msgs) msgs.innerHTML = "تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت... " + percent + "%";
        if (bar) bar.style.width = percent + "%";
    }
}

function DisplayCacheProgress() {
    var bar = document.getElementById("bar");
    var msgs = document.getElementById("msgs");
    
    if (bar) bar.style.width = "100%";
    hideLoader();
    
    if (msgs) msgs.innerHTML = "تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";
    
    setTimeout(function() {
        if (msgs) msgs.innerHTML = "يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله...";
    }, 1800);
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e) { 
        hideLoader();
        var msgs = document.getElementById("msgs");
        if (msgs) {
            msgs.innerHTML = '<span style="color: var(--danger-color);">حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت! امسح البيانات وأعد فتح المتصفح...</span>'; 
        }
    };
}
</script>

</body>
</html>
