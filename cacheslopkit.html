<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<title>Bashir-ps4-ps5</title>
<link rel="stylesheet" href="../style.css">

<style id="fixed-img-background">
html {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: #000 url("img.jpg") center center / cover no-repeat fixed;
    scrollbar-width: none;
}
html::-webkit-scrollbar {
    width: 0;
    height: 0;
}
body {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    position: relative;
    background: transparent !important;
    color: #fff;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.32);
}
body > * {
    position: relative;
    z-index: 1;
}
body h1, body p, body hr {
    color: #fff;
    text-shadow: 2px 2px 5px #000, -1px -1px 2px #000;
}
body hr {
    border-color: rgba(255,255,255,0.65);
}
</style>

</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="<span class='progress-message' dir='rtl'><span class='progress-label'>تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت:</span><span class='progress-percent' dir='ltr'>" + Percent + "%</span></span>";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";setTimeout(function(){window.msgs.innerHTML="يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="خطأ في تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت للمتصفح وأعد فتحه.";};
</script>
<h1> تحياتى مركز بشير </h1>
<hr>
<br>
<h1 id="msgs" dir="rtl" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;direction:rtl;unicode-bidi:plaintext;">بدء تثبيت ذاكرة التخزين المؤقت</h1>

</body>
</html>
