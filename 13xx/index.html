<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashir PS4 — 13.xx</title>
<link rel="stylesheet" href="../style.css">
<style>
:root{--blue:#1aa7ff;--blue2:#006eff;--cyan:#58d8ff;--glass:rgba(3,13,35,.72)}
*{box-sizing:border-box}
html,body{min-height:100%;}
body{padding:28px 14px 42px!important;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:linear-gradient(180deg,rgba(0,8,25,.18),rgba(0,2,12,.62));}
body:after{content:"";position:fixed;inset:auto 0 0;height:180px;background:linear-gradient(transparent,rgba(0,0,0,.48));pointer-events:none;z-index:-1}
h1{margin:10px 0 4px!important;font-size:clamp(25px,3.2vw,38px)!important;letter-spacing:.3px;text-shadow:0 0 24px rgba(0,157,255,.25),0 2px 5px #000}
hr{width:min(680px,82%)!important;margin:8px auto 0;border-top:1px solid rgba(55,190,255,.38)!important;box-shadow:0 0 18px rgba(0,145,255,.16)}
#console{position:relative;width:min(920px,96%);margin:52px auto 0!important;padding:30px 30px 34px!important;border:1px solid rgba(63,195,255,.46)!important;border-radius:22px!important;background:linear-gradient(145deg,rgba(7,25,58,.82),rgba(1,8,24,.70))!important;box-shadow:0 18px 60px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08),0 0 35px rgba(0,132,255,.10);backdrop-filter:blur(8px);overflow:hidden}
#console:before{content:"PS4  •  13.xx";display:block;margin:-4px 0 22px;text-align:right;color:#72d9ff;font-size:14px;letter-spacing:1.5px;opacity:.85}
#console:after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue2),transparent);box-shadow:0 0 18px rgba(45,191,255,.65)}
#console .line{position:relative;margin:10px 0!important;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.045);font-size:clamp(19px,2.2vw,25px);line-height:1.55}
#console .line:first-child{background:rgba(0,150,255,.075);border-color:rgba(80,200,255,.14)}
.ok{color:#a7ffd0!important}.bad{color:#ffaaa9!important}.warn{color:#ffe49e!important}
@media(max-width:700px){body{padding:20px 8px 30px!important}#console{margin-top:34px!important;padding:22px 16px 24px!important;border-radius:17px!important;width:97%}#console:before{margin-bottom:16px;font-size:12px}#console .line{padding:10px 12px}}
</style>
</head>
<body>
<h1>Bashir  13.xx</h1>
<hr>
<div id="console"><div class="line warn">جارٍ التحقق من النظام...</div></div>

<script>
(function () {
    var con = document.getElementById("console");

    function print(msg, cls) {
        var div = document.createElement("div");
        div.className = "line" + (cls ? " " + cls : "");
        div.textContent = msg;
        con.appendChild(div);
    }

    // إبقاء الرقم وعلامة % في اتجاه واحد حتى لا يعكس RTL ترتيبها على PS4.
    // عداد الكاش: سطر واحد فقط يتحدث بدل إنشاء سطر جديد مع كل حدث progress.
    function printPercent(label, value, cls) {
        var div = document.getElementById("cache-progress");
        if (!div) {
            div = document.createElement("div");
            div.id = "cache-progress";
            div.className = "line" + (cls ? " " + cls : "");
            con.appendChild(div);
        } else if (cls) {
            div.className = "line " + cls;
        }

        var pct = Math.max(0, Math.min(100, Math.round(value)));
        div.textContent = label;
        var span = document.createElement("span");
        span.setAttribute("dir", "ltr");
        span.style.unicodeBidi = "embed";
        span.textContent = pct + "%";
        div.appendChild(span);
    }

    var params = new URLSearchParams(location.search);
    var SUPPORTED = {1302:1,1304:1,1350:1,1352:1};
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 10);
        var minorKey = String(minor).padStart(2, "0");
        key = m[1] + "." + minorKey;
        fwnum = parseInt(m[1], 10) * 100 + minor;
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    con.innerHTML = "";
    print("إصدار النظام: " + (key || "غير معروف"), supported ? "ok" : "bad");

    function go() {
        print("جارٍ تشغيل الثغرة...", "warn");
        location.replace("jb.html" + location.search);
    }

    function waitForTap(msg, action) {
        if (msg) print(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        print("إصدار غير مدعوم — اضغط X أو انقر للتشغيل ", "bad");
        waitForTap("", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        print("الإنترنت غير متصل — سيتم التشغيل من الكاش", "ok");
        go();
    } else if (ac.status === ac.IDLE) {
        print("الكاش جاهز — بدء التشغيل", "ok");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        print("تم تحديث الكاش — اضغط X أو انقر لإعادة التحميل", "ok");
        waitForTap("", function () { location.reload(); });
    } else {
        print("جارٍ تجهيز الكاش لأول تشغيل...", "warn");
        ac.addEventListener("downloading", function () {
            print("بدء تحميل ملفات الكاش...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                printPercent("الكاش: ", (e.loaded / e.total) * 100);
            }
        }, false);
        ac.addEventListener("cached", function () {
            print("تم حفظ الكاش — جاهز للعمل بدون إنترنت", "ok");
            waitForTap("اضغط X أو انقر لبدء التشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            print("تم تحديث الكاش — اضغط X أو انقر لإعادة التحميل", "ok");
            waitForTap("", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            print("الكاش جاهز للعمل بدون إنترنت", "ok");
            go();
        }, false);
        ac.addEventListener("error", function () {
            print("تعذر تحديث الكاش — سيتم محاولة التشغيل مباشرة", "bad");
            waitForTap("اضغط X أو انقر للمتابعة", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            print("الكاش قديم — سيتم التشغيل مباشرة", "warn");
            waitForTap("اضغط X أو انقر للمتابعة", go);
        }, false);
    }
})();
</script>
</body>
</html>
