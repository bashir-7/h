<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashir — تثبيت الكاش</title>
<link rel="stylesheet" href="../style.css">
<style>
:root{--blue:#18a9ff;--cyan:#67dcff}
body{padding:24px 12px 40px!important;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,rgba(0,8,24,.12),rgba(0,3,14,.65))}
h1{margin-top:10px!important;font-size:clamp(24px,3vw,34px)!important}
hr{margin-top:5px!important;width:min(650px,82%)!important}
#msgs{position:relative;width:min(850px,95%)!important;margin:18vh auto 0!important;padding:34px 24px!important;border:1px solid rgba(71,201,255,.45)!important;border-radius:22px!important;background:linear-gradient(145deg,rgba(5,24,55,.82),rgba(1,8,24,.72))!important;box-shadow:0 18px 55px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.07),0 0 35px rgba(0,132,255,.11);font-size:clamp(24px,3.2vw,34px)!important;line-height:1.65!important;backdrop-filter:blur(8px);overflow:hidden}
#msgs:before{content:"";display:block;margin-bottom:12px;color:var(--cyan);font-size:12px;letter-spacing:2px;opacity:.8}
#msgs:after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent);box-shadow:0 0 18px rgba(40,190,255,.6)}
@media(max-width:700px){#msgs{width:97%!important;margin-top:15vh!important;padding:25px 15px!important}}
</style>
<script>
function setMsg(text) {
    var el = document.getElementById("msgs");
    if (el) el.textContent = text;
}
function setProgress(value) {
    var el = document.getElementById("msgs");
    if (!el) return;
    var pct = Math.max(0, Math.min(100, Math.round(value)));
    el.textContent = "بدء تثبيت ذاكرة التخزين المؤقت... ";
    var span = document.createElement("span");
    span.setAttribute("dir", "ltr");
    span.style.unicodeBidi = "embed";
    span.textContent = pct + "%";
    el.appendChild(span);
}
function DLProgress(e) {
    if (e && e.total) {
        setProgress(e.loaded / e.total * 100);
    }
}
function done() {
    setMsg("تم تثبيت ذاكرة التخزين المؤقت بنجاح— جارٍ فتح الصفحة...");
    setTimeout(function () {
        location.replace("index.html");
    }, 1200);
}
window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.addEventListener("cached", done, false);
window.applicationCache.addEventListener("updateready", function () {
    try { window.applicationCache.swapCache(); } catch (e) {}
    done();
}, false);
window.applicationCache.addEventListener("noupdate", function () {
    location.replace("index.html");
}, false);
window.applicationCache.addEventListener("error", function () {
    setMsg("خطأ في تثبيت ذاكرة التخزين المؤقت!— حاول مرة أخرى.");
}, false);
</script>
</head>
<body>
<h1>بشير لصيانة الاجهزة الالكترونية</h1>
<hr>
<div id="msgs">جارٍتجهيز ذاكرة التخزين المؤقت...</div>
</body>
</html>
