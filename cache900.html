<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<title>Bashir electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>

var lastPercent = -1;
function DLProgress(e) {
    if (!e || !e.lengthComputable || !e.total) return;
    var Percent = Math.round((e.loaded / e.total) * 100);
    if (Percent === lastPercent) return;
    lastPercent = Percent;
    window.msgs.innerHTML =
        '<span dir="rtl">جارٍ تثبيت ذاكرة التخزين المؤقت... ' +
        '<span dir="ltr" style="unicode-bidi:isolate;display:inline-block;">' +
        Percent + '%</span></span>';
}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔✔✔";setTimeout(function(){window.msgs.innerHTML="يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="تعذر تثبيت ذاكرة التخزين المؤقت. امسح بيانات المتصفح ثم أعد المحاولة.";};
</script>
<h1>Bashir-9xx-13xx</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جارٍ تثبيت ذاكرة التخزين المؤقت... 0%</h1>

</body>
</html>
