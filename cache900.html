<!DOCTYPE html>
<html manifest="900.manifest" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز بشير لصيانة وتعديل الأجهزة الإلكترونية</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0a0b10 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #ffffff; 
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            filter: blur(150px);
            opacity: 0.2;
            top: 20%;
            right: 20%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            filter: blur(150px);
            opacity: 0.15;
            bottom: 20%;
            left: 20%;
            z-index: 0;
        }

        .container {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 1;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 650px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            gap: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            position: relative;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00f2fe, #ff007f, transparent);
            border-radius: 0 0 4px 4px;
        }

            .status-message {
            font-size: 1.4rem; 
            font-weight: 700; 
            line-height: 1.6; 
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
        }

        .loader {
            width: 80px; 
            height: 80px; 
            border: 3px solid transparent; 
            border-top-color: #00f2fe; 
            border-bottom-color: #00f2fe;
            border-radius: 50%; 
            animation: spin 1.5s infinite linear; 
            display: inline-block;
            position: relative;
        }

        .loader::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 3px solid transparent;
            border-left-color: #ff007f;
            border-right-color: #ff007f;
            border-radius: 50%;
            animation: spin-reverse 1s infinite linear;
        }

        .loader::after {
            content: '';
            position: absolute;
            top: 22px;
            left: 22px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f2fe, 0 0 30px #00f2fe;
        }

          .progress-box {
            width: 100%;
            max-width: 450px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #00f2fe);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse { 
            0% { transform: rotate(360deg); } 
            100% { transform: rotate(0deg); } 
        } 
    </style>
</head>
<body>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var percent = Math.round(e.loaded / e.total * 100);
    
    window.msgs.innerHTML = "تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت...";
    
    var bar = document.getElementById("bar");
    if (bar) {
        bar.style.width = percent + "%";
    }
}

function DisplayCacheProgress() {
    var bar = document.getElementById("bar");
    if (bar) {
        bar.style.width = "100%";
    }
    
    window.msgs.innerHTML = "تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";
    setTimeout(function() {
        window.msgs.innerHTML = "يرجى قطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله...";
    }, 1500);
}

window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
window.applicationCache.onerror = function(e) { 
    window.msgs.innerHTML = "حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت وأعد فتح المتصفح ..."; 
};
</script>

<div class="container">
    <div class="status-card">
        <span class="loader"></span>
        <h2 id="msgs" class="status-message">بدء تثبيت ذاكرة التخزين المؤقت...</h2>
        
        <div class="progress-box">
            <div id="bar" class="progress-bar"></div>
        </div>
    </div>
</div>

</body>
</html>
